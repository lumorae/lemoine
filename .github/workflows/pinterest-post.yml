name: Daily Pinterest post

# The cron is commented out until Standard access is approved on the
# Pinterest app. On Trial access, POST /pins is rejected (Trial pins must
# use the sandbox API), so scheduled runs would fail daily. Once Standard
# is granted, uncomment the schedule block below and the job will start
# posting 3 pins/day autonomously.
on:
  # schedule:
  #   - cron: "0 15 * * *"   # 15:00 UTC = 08:00 Pacific
  workflow_dispatch:
    inputs:
      pins_per_run:
        description: "How many pins to post this run"
        required: false
        default: "3"

permissions:
  contents: write   # allow committing back the posted.json state

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh Etsy listings + pin content
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
        run: |
          python3 etsy-audit/pull_etsy.py
          python3 etsy-audit/generate_pins.py

      - name: Restore posting state
        uses: actions/cache@v4
        with:
          path: pinterest/posted.json
          key: pinterest-posted-${{ github.run_id }}
          restore-keys: |
            pinterest-posted-

      - name: Post pins to Pinterest
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINS_PER_RUN: ${{ inputs.pins_per_run || '3' }}
        run: python3 pinterest/post_pins.py
